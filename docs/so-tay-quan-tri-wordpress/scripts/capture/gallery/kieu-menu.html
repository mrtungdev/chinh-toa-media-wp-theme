<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Bốn kiểu thanh menu</title>
<style>
  body { margin: 0; background: #f0f0f1; font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; color: #1d2327; }
  .wrap { width: 900px; padding: 20px; box-sizing: border-box; }
  h1 { font-size: 20px; margin: 0 0 14px; }
  .row { display: flex; align-items: center; gap: 16px; background: #fff; border: 1px solid #dcdcde; border-radius: 8px; padding: 10px 14px; margin-bottom: 10px; }
  .row img { width: 560px; height: auto; display: block; border: 1px solid #eee; border-radius: 4px; }
  .name { font-weight: 600; min-width: 70px; }
  .note { color: #646970; font-size: 13px; }
</style>
</head>
<body>
<div class="wrap" id="gallery">
  <h1>Bốn ô ảnh trong mục “Kiểu thanh menu” (theo thứ tự từ trái qua)</h1>
  <div class="row"><div class="name">Kiểu 1</div><img src="../../../../../chinhtoa/assets/imgs/layouts/nav-style-2.png" alt=""><div class="note">Thanh tối, mục đang xem tô màu nhấn.</div></div>
  <div class="row"><div class="name">Kiểu 2</div><img src="../../../../../chinhtoa/assets/imgs/layouts/nav-style-3.png" alt=""><div class="note">Như kiểu 1, thêm vạch màu dưới thanh.</div></div>
  <div class="row"><div class="name">Kiểu 3</div><img src="../../../../../chinhtoa/assets/imgs/layouts/nav-style-4.png" alt=""><div class="note">Thanh sáng màu kem, gạch chân mục đang xem.</div></div>
  <div class="row"><div class="name">Kiểu 4</div><img src="../../../../../chinhtoa/assets/imgs/layouts/nav-style-5.png" alt=""><div class="note">Thanh màu đặc, các mục chia đều bề ngang.</div></div>
</div>
</body>
</html>
