<svg xmlns="http://www.w3.org/2000/svg" viewBox="62 46 198 116" width="198" height="116">
  <!--
    Logo "5 phút cho Lời Chúa" — dựng lại dạng vector, bám theo logo gốc (toạ độ đo trên
    ảnh mẫu, đơn vị = pixel của logo gốc). Font: Arial Italic (số 5, "phút cho"),
    Times New Roman Bold ("LỜI CHÚA") — font hệ thống, chỉ dùng để xuất PNG:
      rsvg-convert -w 792 logo-5phut.svg -o logo-5phut.png
  -->
  <defs>
    <radialGradient id="ball" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#ff6b4a"/>
      <stop offset="0.45" stop-color="#e3141b"/>
      <stop offset="1" stop-color="#9b0a12"/>
    </radialGradient>
    <linearGradient id="flameOuter" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#e2231a"/>
      <stop offset="0.55" stop-color="#f6721e"/>
      <stop offset="1" stop-color="#ffb22e"/>
    </linearGradient>
    <linearGradient id="flameMid" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#f4511e"/>
      <stop offset="1" stop-color="#ffa726"/>
    </linearGradient>
    <linearGradient id="flameInner" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ff8a1f"/>
      <stop offset="0.6" stop-color="#ffc93a"/>
      <stop offset="1" stop-color="#fff07a"/>
    </linearGradient>
    <linearGradient id="layer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9ebf8"/>
    </linearGradient>
    <filter id="txtShadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0.8" dy="1" stdDeviation="0.8" flood-color="#14185a" flood-opacity="0.8"/>
    </filter>
    <filter id="bookShadow" x="-5%" y="-10%" width="110%" height="130%">
      <feDropShadow dx="0" dy="0.8" stdDeviation="0.9" flood-color="#2a2e78" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- ===================== Quyển sách mở ===================== -->
  <g filter="url(#bookShadow)" stroke="#5a5ea8" stroke-width="0.85" stroke-linejoin="round" stroke-linecap="round">
    <!-- bìa sau (lớp ngoài cùng) -->
    <path fill="url(#layer)" d="M160 116.5 L94.5 118.6 L65.5 152.6 C88 149.4 116 149 136 150.2 C150 151.2 157 153.6 160 157.4 C163 153.6 170 151.2 184 150.2 C204 149 232 149.4 254.5 152.6 L225.5 118.6 Z"/>
    <!-- lớp mép trang -->
    <path fill="url(#layer)" d="M160 115 L98 116.3 L72.5 148.8 C92 145.8 116 145.4 134 146.6 C148 147.6 156 150.6 160 155.5 C164 150.6 172 147.6 186 146.6 C204 145.4 228 145.8 247.5 148.8 L222 116.3 Z"/>
    <!-- trang trái -->
    <path fill="#ffffff" d="M160 113.5 C152 109.6 146 108.6 140 108.8 C128 109.2 116 110.6 105 112.3 L101 114.6 L80 146.2 C96 143.5 116 142.6 132 143.6 C146 144.6 155 147.6 160 153.5 Z"/>
    <!-- trang phải -->
    <path fill="#ffffff" d="M160 113.5 C168 109.6 174 108.6 180 108.8 C192 109.2 204 110.6 215 112.3 L219 114.6 L240 146.2 C224 143.5 204 142.6 188 143.6 C174 144.6 165 147.6 160 153.5 Z"/>
    <!-- gáy sách -->
    <path fill="none" stroke-width="1.3" d="M160 113.5 L160 155.6"/>
    <path fill="#2a2d6e" stroke="none" d="M157.6 154 L162.4 154 L160 157.4 Z"/>
  </g>

  <!-- ===================== Số 5 lửa ===================== -->
  <!-- khối lửa (sau quả cầu): đỏ ở gốc → cam → vàng ở đỉnh, ôm bên trái thân số 5 -->
  <path fill="url(#flameOuter)" d="M86.2 92 C84.6 85 85.4 78.6 88 73.6 C89.4 70.8 89.4 67.8 88.4 64.8 C91.6 66.8 93.2 70 93.4 73.2 C94.6 69.4 94.8 65.2 93.6 60.8 C97.4 64.2 98.8 69 98.2 73.6 L102 75.2 C103 81 100 86.8 95.4 90.4 Z"/>
  <path fill="url(#flameMid)" d="M89.4 82 C88.4 77.4 89.4 73.4 91.6 70 C92.8 68 93.2 65.6 92.8 63 C95.6 65.6 96.6 69.2 96.2 72.6 C97.2 70.8 97.6 68.6 97.4 66.4 C99.6 69.4 100.2 73.4 99.2 77.4 Z"/>
  <path fill="url(#flameInner)" d="M91.6 80 C90.2 74.6 91.2 69.6 94 65 C96 61.8 97.2 57.4 96.8 52.8 C97.2 51.6 98 50.8 99 50.4 C101.4 54.2 102.2 58.6 101.4 62.8 C100.8 66.2 100.2 69.6 100.6 73.4 C101 76.4 100.2 79.2 98.4 81.4 Z"/>
  <!-- quả cầu đỏ -->
  <circle cx="95.4" cy="88" r="10.7" fill="url(#ball)"/>
  <!-- ngọn lửa trắng nhỏ trong quả cầu -->
  <path fill="none" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"
        d="M89.6 89.4 C89.2 85.4 90.8 82 94 80 C93.8 82.4 94.8 84 96.6 84.6 C96.2 82.4 97.6 80.2 100 79.2 C99.6 81.6 100.4 83.6 101.8 84.8"/>
  <!-- số 5 trắng: gạch trên nghiêng + thân + bụng tròn ôm quả cầu -->
  <g filter="url(#txtShadow)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path stroke="#2a2d6e" stroke-width="4.9" stroke-opacity="0.5" d="M116 57.6 L99.6 60.4 L97.2 74.4 C102.5 71.6 109.6 73.6 112 80 C114.4 86.6 111.4 95.6 103 99.6 C97.4 102.2 91.4 100.6 88 96.6"/>
    <path stroke="#ffffff" stroke-width="3.9" d="M116 57.6 L99.6 60.4 L97.2 74.4 C102.5 71.6 109.6 73.6 112 80 C114.4 86.6 111.4 95.6 103 99.6 C97.4 102.2 91.4 100.6 88 96.6"/>
  </g>

  <!-- ===================== Chữ ===================== -->
  <text x="114.2" y="71" font-family="Arial" font-style="italic" font-size="28.2" letter-spacing="0.6" filter="url(#txtShadow)"
        fill="#ffffff" stroke="#ffffff" stroke-width="0.7" stroke-linejoin="round">phút cho</text>
  <text x="116" y="99.2" font-family="Times New Roman" font-weight="700" font-size="23.4" letter-spacing="0.42" filter="url(#txtShadow)"
        fill="#d7141c" stroke="#ffffff" stroke-width="1.4" paint-order="stroke" stroke-linejoin="round">LỜI CHÚA</text>
</svg>
